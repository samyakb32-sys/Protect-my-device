# Builds a debug APK to install on a test phone, and attaches it to the run as "app-debug".
# Needs the repository secret GOOGLE_SERVICES_JSON: the full text of your app/google-services.json.
# Run it from Actions → "Debug APK" → Run workflow, or by pushing to the branch below.
name: Debug APK
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-planck-rk9xqf]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # Without the real config the app can't sign in, so refuse to build a useless APK.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the repository secret GOOGLE_SERVICES_JSON (Settings → Secrets and variables → Actions) with the contents of your google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
