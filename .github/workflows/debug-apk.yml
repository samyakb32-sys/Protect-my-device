# Builds a debug APK to install on a test phone, and attaches it to the run as "app-debug".
# With the repository secret GOOGLE_SERVICES_JSON (the full text of your app/google-services.json) the APK
# can sign in. Without it, it is built with the placeholder config: sign-in won't work, but the
# "test the battery screen" button on the sign-in page does.
# Run it from Actions → "Debug APK" → Run workflow, or by pushing to the branch below.
name: Debug APK
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-planck-rk9xqf]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret: building with the placeholder config. Sign-in won't work; use \"test the battery screen\" on the sign-in page."
            cp app/google-services.example.json app/google-services.json
          fi
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
